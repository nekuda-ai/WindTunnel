tasks:
  - id: blog-find-post
    tier: answer
    prompt: Find the post whose title starts with "Introducing" and report its full title.
    # The oracle (capsules/tailwind-nextjs-blog/oracle.sh) only exposes page
    # render probes — both matching seeded titles satisfy the prompt as worded.
    predicate:
      type: answer
      contains_any: [tailwind nextjs starter blog, multi-part posts]
  - id: blog-read-author
    start_path: /about
    tier: answer
    prompt: Who is the author shown on this About page?
    # No author probe in the oracle. "Who authors this blog?" was ambiguous:
    # the site carries a default author (Tails Azimuth), post co-authors
    # (Sparrow Hawk), and the template's own credit (Timothy Lin), and the
    # ask_site index legitimately indexes co-authors too. app/about/page.tsx
    # renders the `default` author only, so naming the page pins the answer
    # without rewriting site content.
    predicate:
      type: answer
      contains: [azimuth]
