name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.11 is the declared floor (import.meta.dirname landed there);
        # 22 is what most contributors actually run.
        node: ['20.11', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The publication gate checks the frozen v1.2 commit.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: Verify published benchmark results
        run: node scripts/verify-published-results.mjs
      - name: Verify published Jev traces
        run: python3 scripts/verify-jev-release.py
      - name: Verify portable Jev runners (no provider calls)
        if: matrix.node == '22'
        run: |
          npm ci --prefix experiments/jev
          node experiments/jev/run.mjs --interface webmcp
          node experiments/jev/run.mjs --interface dom
      # Dry run: no key, no Docker, no browser — exercises task loading,
      # the arm loop, scoring, and report writing on every push.
      - run: WT_FAKE_LIFECYCLE=1 npm run bench
